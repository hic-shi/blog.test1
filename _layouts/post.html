---
layout: default
---
<article>
  <header style="background: none; padding: 0; color: inherit; display: block; border-bottom: 1px solid #eee; margin-bottom: 1.5rem; padding-bottom: 1rem;">
    <h1 style="margin: 0 0 0.5rem 0;">{{ page.title }}</h1>
    <p style="color: #777; font-size: 0.9rem; margin: 0;">投稿日: {{ page.date | date: "%Y年%m月%d日" }}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <p style="margin-top: 3rem;">
    <a href="{{ '/' | relative_url }}">&larr; 記事一覧に戻る</a>
  </p>
</article>
